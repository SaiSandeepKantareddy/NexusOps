[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusops"
version = "0.1.0"
description = "GitHub-native multi-agent runtime for skill-driven engineering loops."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Sai Sandeep Kantareddy" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
agents = [
  "openai>=1.93.0",
  "openai-agents>=0.1.0"
]
github = [
  "PyGithub>=2.3.0",
  "GitPython>=3.1.0"
]
mcp = [
  "mcp>=1.0.0",
  "fastmcp>=2.0.0"
]
observability = [
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-exporter-otlp>=1.26.0",
  "arize-phoenix>=4.0.0",
  "openinference-instrumentation-openai>=0.1.0"
]
storage = [
  "sqlalchemy>=2.0.0"
]
local-models = [
  "litellm>=1.44.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0"
]
server = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "sse-starlette>=2.1.0"
]

[project.scripts]
nexus = "nexusops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusops"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".conda",
  ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
